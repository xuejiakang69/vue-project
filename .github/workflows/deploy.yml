name: Deploy Vue Project

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      ########################################
      # 拉取代码
      ########################################
      - name: Checkout code
        uses: actions/checkout@v5

      ########################################
      # Node环境
      ########################################
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      ########################################
      # 判断环境
      ########################################
      - name: Set Deploy Environment
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV=production" >> $GITHUB_ENV
            echo "IS_PROD=true" >> $GITHUB_ENV
            echo "DEPLOY_PATH=/www/wwwroot/vue/vue-prod/" >> $GITHUB_ENV
          else
            echo "ENV=test" >> $GITHUB_ENV
            echo "IS_PROD=false" >> $GITHUB_ENV
            echo "DEPLOY_PATH=/www/wwwroot/vue/vue-test/" >> $GITHUB_ENV
          fi

      ########################################
      # npm私服
      ########################################
      - name: Configure npm authentication
        run: |
          echo "registry=https://packages.aliyun.com/5faa3678e6f9d07f148517ac/npm/npm-registry/" > .npmrc
          echo "//packages.aliyun.com/5faa3678e6f9d07f148517ac/npm/npm-registry/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

      ########################################
      # 安装依赖
      ########################################
      - name: Install dependencies
        run: npm ci

      ########################################
      # 打包
      ########################################
      - name: Build
        run: npm run build

      ########################################
      # 获取版本
      ########################################
      - name: Get Version
        run: |
          VERSION=$(cat VERSION)
          if [ -z "$VERSION" ]; then
            echo "❌ VERSION为空"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "当前版本:v$VERSION"

      ########################################
      # 测试环境版本校验
      ########################################
      - name: Check Test Version
        if: env.IS_PROD == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            PROD_VERSION_FILE="/www/wwwroot/vue/vue-prod/current/VERSION"
            if [ ! -f "$PROD_VERSION_FILE" ]; then
              echo "⚠️生产版本不存在"
              exit 0
            fi
            PROD_VERSION=$(cat $PROD_VERSION_FILE)
            TEST_VERSION=${{ env.VERSION }}
            echo "===================="
            echo "生产版本:$PROD_VERSION"
            echo "测试版本:$TEST_VERSION"
            echo "===================="
            if [ "$TEST_VERSION" = "$PROD_VERSION" ]; then
              echo "❌测试版本不能等于生产版本"
              exit 1
            fi
            RESULT=$(printf '%s\n%s\n' "$PROD_VERSION" "$TEST_VERSION" | sort -V | tail -n1)
            if [ "$RESULT" != "$TEST_VERSION" ]; then
              echo "❌测试版本必须大于生产版本"
              exit 1
            fi
            echo "✅版本校验通过"

      ########################################
      # 正式版本是否存在
      ########################################
      - name: Check Version Exists
        if: env.IS_PROD == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            if [ -d "/www/wwwroot/vue/vue-prod/releases/v${{ env.VERSION }}" ]; then
              echo "❌版本已经存在"
              exit 1
            fi
            echo "✅版本可以发布"

      ########################################
      # 创建版本目录
      ########################################
      - name: Create Release Directory
        if: env.IS_PROD == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            mkdir -p /www/wwwroot/vue/vue-prod/releases/v${{ env.VERSION }}

      ########################################
      # 上传正式版本
      ########################################
      - name: Upload Production Version
        if: env.IS_PROD == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: |
            dist/*
            VERSION
          target: "/www/wwwroot/vue/vue-prod/releases/v${{ env.VERSION }}/"

      ########################################
      # 切换current
      ########################################
      - name: Switch Current Version
        if: env.IS_PROD == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /www/wwwroot/vue/vue-prod
            rm -rf current
            cp -r releases/v${{ env.VERSION }} current
            echo "当前版本:v${{ env.VERSION }}"

      ########################################
      # 清理旧版本
      ########################################
      - name: Clean Old Versions
        if: env.IS_PROD == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /www/wwwroot/vue/vue-prod/releases
            ls -dt v* | tail -n +4 | xargs -r rm -rf
            echo "旧版本清理完成"

      ########################################
      # 测试环境部署
      ########################################
      - name: Deploy Test Environment
        if: env.IS_PROD == 'false'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist/*"
          target: "${{ env.DEPLOY_PATH }}"

      ########################################
      # 成功
      ########################################
      - name: Deploy Success
        if: success()
        run: |
          echo "=============================="
          echo "🎉 Vue部署成功"
          echo "环境:${{ env.ENV }}"
          echo "版本:v${{ env.VERSION }}"
          echo "分支:${{ github.ref_name }}"
          echo "时间:$(date)"
          echo "=============================="

      ########################################
      # 失败
      ########################################
      - name: Deploy Failed
        if: failure()
        run: |
          echo "=============================="
          echo "❌ Vue部署失败"
          echo "版本:v${{ env.VERSION }}"
          echo "=============================="
