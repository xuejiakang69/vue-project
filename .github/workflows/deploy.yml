name: Deploy Vue Project


on:

  push:
    branches:
      - main
      - test

  workflow_dispatch:



jobs:

  deploy:

    runs-on: ubuntu-latest


    steps:


      ########################################
      # 拉取代码
      ########################################

      - name: Checkout code
        uses: actions/checkout@v5



      ########################################
      # Node环境
      ########################################

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm



      ########################################
      # 判断环境
      ########################################

      - name: Set Deploy Environment
        run: |

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then

            echo "ENV=production" >> $GITHUB_ENV
            echo "IS_PROD=true" >> $GITHUB_ENV
            echo "DEPLOY_PATH=/www/wwwroot/vue/vue-prod/" >> $GITHUB_ENV

          else

            echo "ENV=test" >> $GITHUB_ENV
            echo "IS_PROD=false" >> $GITHUB_ENV
            echo "DEPLOY_PATH=/www/wwwroot/vue/vue-test/" >> $GITHUB_ENV

          fi



      ########################################
      # npm配置
      ########################################

      - name: Configure npm authentication
        run: |

          echo "registry=https://packages.aliyun.com/5faa3678e6f9d07f148517ac/npm/npm-registry/" > .npmrc

          echo "//packages.aliyun.com/5faa3678e6f9d07f148517ac/npm/npm-registry/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc



      ########################################
      # 安装依赖
      ########################################

      - name: Install dependencies
        run: npm ci



      ########################################
      # 打包
      ########################################

      - name: Build
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npm run build:prod
          else
            npm run build:test
          fi


      
      - name: Debug Build Files
        run: |
          echo "================================"
          echo "当前分支: ${{ github.ref_name }}"
          echo "当前环境: $ENV"
          echo "================================"

          echo "API地址检查:"
          grep -R -oE 'https://api(-test)?\.online3\.me' dist | sort -u || true

          echo "================================"

          pwd
          ls -la
          ls -la dist
          ls -la VERSION


      ########################################
      # 检查文件
      ########################################

      - name: Debug Build Files
        run: |

          pwd

          echo "================"

          ls -la

          echo "================"

          ls -la dist

          echo "================"

          ls -la VERSION



      ########################################
      # 获取版本
      ########################################

      - name: Get Version
        run: |

          if [ ! -f VERSION ]; then

            echo "❌ VERSION不存在"

            exit 1

          fi


          VERSION=$(cat VERSION)


          if [ -z "$VERSION" ]; then

            echo "❌ VERSION为空"

            exit 1

          fi


          echo "VERSION=$VERSION" >> $GITHUB_ENV


          echo "当前版本:v$VERSION"



      ########################################
      # 测试版本校验
      ########################################

      - name: Check Test Version

        if: env.IS_PROD == 'false'

        uses: appleboy/ssh-action@v1.0.3


        with:

          host: ${{ secrets.SERVER_HOST }}

          username: root

          password: ${{ secrets.SERVER_PASSWORD }}


          script: |

            PROD_VERSION_FILE="/www/wwwroot/vue/vue-prod/current/VERSION"


            if [ ! -f "$PROD_VERSION_FILE" ]; then

              echo "⚠️生产版本不存在"

              exit 0

            fi


            PROD_VERSION=$(cat $PROD_VERSION_FILE)

            TEST_VERSION=${{ env.VERSION }}


            echo "生产:$PROD_VERSION"

            echo "测试:$TEST_VERSION"



            if [ "$TEST_VERSION" = "$PROD_VERSION" ]; then

              echo "❌版本相同"

              exit 1

            fi



            RESULT=$(printf '%s\n%s\n' "$PROD_VERSION" "$TEST_VERSION" | sort -V | tail -n1)



            if [ "$RESULT" != "$TEST_VERSION" ]; then

              echo "❌测试版本必须大于生产版本"

              exit 1

            fi


            echo "✅版本校验通过"



      ########################################
      # 创建生产目录
      ########################################

      - name: Create Release Directory

        if: env.IS_PROD == 'true'

        uses: appleboy/ssh-action@v1.0.3


        with:

          host: ${{ secrets.SERVER_HOST }}

          username: root

          password: ${{ secrets.SERVER_PASSWORD }}


          script: |

            mkdir -p /www/wwwroot/vue/vue-prod/releases/v${{ env.VERSION }}



      ########################################
      # 上传正式环境
      ########################################

      - name: Upload Production Version

        if: env.IS_PROD == 'true'

        uses: appleboy/scp-action@v1


        with:

          host: ${{ secrets.SERVER_HOST }}

          username: root

          password: ${{ secrets.SERVER_PASSWORD }}


          source: "dist,VERSION"


          target: "/www/wwwroot/vue/vue-prod/releases/v${{ env.VERSION }}/"



      ########################################
      # 切换current
      ########################################

      - name: Switch Current Version

        if: env.IS_PROD == 'true'

        uses: appleboy/ssh-action@v1.0.3


        with:

          host: ${{ secrets.SERVER_HOST }}

          username: root

          password: ${{ secrets.SERVER_PASSWORD }}


          script: |

            cd /www/wwwroot/vue/vue-prod


            rm -rf current


            cp -r releases/v${{ env.VERSION }} current


            echo "当前版本:v${{ env.VERSION }}"



      ########################################
      # 清理旧版本
      ########################################

      - name: Clean Old Versions

        if: env.IS_PROD == 'true'

        uses: appleboy/ssh-action@v1.0.3


        with:

          host: ${{ secrets.SERVER_HOST }}

          username: root

          password: ${{ secrets.SERVER_PASSWORD }}


          script: |

            cd /www/wwwroot/vue/vue-prod/releases


            ls -dt v* | tail -n +4 | xargs -r rm -rf



      ########################################
      # 测试环境上传
      ########################################

      - name: Deploy Test Environment

        if: env.IS_PROD == 'false'

        uses: appleboy/scp-action@v1


        with:

          host: ${{ secrets.SERVER_HOST }}

          username: root

          password: ${{ secrets.SERVER_PASSWORD }}


          source: "dist"


          target: "${{ env.DEPLOY_PATH }}"



      ########################################
      # 成功
      ########################################

      - name: Deploy Success

        if: success()

        run: |

          echo "========================"

          echo "🎉 Vue部署成功"

          echo "环境:${{ env.ENV }}"

          echo "版本:v${{ env.VERSION }}"

          echo "分支:${{ github.ref_name }}"

          echo "========================"



      ########################################
      # 失败
      ########################################

      - name: Deploy Failed

        if: failure()

        run: |

          echo "========================"

          echo "❌ Vue部署失败"

          echo "========================"
